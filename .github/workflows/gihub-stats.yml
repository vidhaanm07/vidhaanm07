name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=vidhaanm07&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&bg_color=050505&title_color=35F5D0&text_color=E8FFFB&icon_color=35F5D0
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=vidhaanm07&layout=compact&langs_count=8&hide_border=true&bg_color=050505&title_color=35F5D0&text_color=E8FFFB
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Generated Statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git commit -m "Update GitHub statistics" || exit 0

          git push
