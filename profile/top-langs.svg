      <rect mask="url(#rect-mask)" x="0.00" y="0" width="291.11" height="8" fill="#e34c26"/>
      <rect mask="url(#rect-mask)" x="291.11" y="0" width="104.42" height="8" fill="#DA5B0B"/>
      <rect mask="url(#rect-mask)" x="395.52" y="0" width="16.22" height="8" fill="#f1e05a"/>
      <rect mask="url(#rect-mask)" x="411.75" y="0" width="5.25" height="8" fill="#3572A5"/>

      <g transform="translate(0, 25)">
        <g class="stagger" style="animation-delay: 450ms">
